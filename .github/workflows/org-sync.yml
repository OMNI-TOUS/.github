name: org-sync

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 11 * * 1"
    - cron: "0 11 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [sync, weekly, monthly]
        default: sync
      dry-run:
        description: Plan only, change nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
  PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}

jobs:
  sync:
    if: github.event.schedule == '*/5 * * * *' || inputs.job == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: org-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ORG_SYNC_APP_ID }}
          private-key: ${{ secrets.ORG_SYNC_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - run: scripts/sync.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

  weekly:
    if: github.event.schedule == '0 11 * * 1' || inputs.job == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: org-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ORG_SYNC_APP_ID }}
          private-key: ${{ secrets.ORG_SYNC_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - run: scripts/report.sh weekly
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLA_DAYS: ${{ vars.SLA_DAYS }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  monthly:
    if: github.event.schedule == '0 11 1 * *' || inputs.job == 'monthly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    concurrency:
      group: org-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ORG_SYNC_APP_ID }}
          private-key: ${{ secrets.ORG_SYNC_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - run: scripts/report.sh monthly
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLA_DAYS: ${{ vars.SLA_DAYS }}
          REPORT_REPO: ${{ vars.REPORT_REPO }}
      - name: Keep the schedule enabled
        if: env.DRY_RUN != 'true'
        run: gh workflow enable org-sync.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
